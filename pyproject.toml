[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "black-scholes-pde"
version = "0.1.0"
description = "Reusable code for a PDE project on Black-Scholes option pricing."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]
